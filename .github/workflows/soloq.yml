name: SoloQ Challenge

# Cada 30 minutos: lee las inscripciones de la web, mira en la API de Riot la liga y las partidas de
# Solo/Dúo de cada inscrito, manda a Discord el parte del día (una vez, a partir de las 09:00) y
# regenera el tablón en docs/soloq/. Solo guarda (y publica) si algo ha cambiado.
# El pistoletazo lo da el administrador: Actions → SoloQ Challenge → Run workflow → «empezar».
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      accion:
        description: "Qué hacer"
        type: choice
        options: [actualizar, empezar, terminar]
        default: actualizar
      dias:
        description: "Con «empezar»: cuántos días dura el reto (vacío = lo que diga config.json)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: soloq
  cancel-in-progress: false

jobs:
  soloq:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar el tablón
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          ACCION: ${{ inputs.accion || 'actualizar' }}
          DIAS: ${{ inputs.dias || '' }}
        run: |
          if [ "$ACCION" = "empezar" ]; then
            python -m roast soloq --empezar ${DIAS:+--dias "$DIAS"}
          elif [ "$ACCION" = "terminar" ]; then
            python -m roast soloq --terminar
          else
            python -m roast soloq
          fi

      - name: Guardar datos y web en el repositorio
        run: |
          git config user.name "El Rincón del Feeder"
          git config user.email "feed-diario@users.noreply.github.com"
          git add data/soloq docs/soloq
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "SoloQ Challenge: clasificación de las $(TZ=Europe/Madrid date +%H:%M)"
          # el robot del periódico y la rutina de Claude también suben cosas: se reintenta encima de lo suyo
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
