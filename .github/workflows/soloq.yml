name: SoloQ Challenge

# Cada 30 minutos: lee las inscripciones de la web, mira en la API de Riot la liga y las partidas de
# Solo/Dúo de cada inscrito y regenera docs/soloq/. Solo guarda (y publica) si algo ha cambiado.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soloq
  cancel-in-progress: false

jobs:
  soloq:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar la clasificación
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python -m roast soloq

      - name: Guardar datos y web en el repositorio
        run: |
          git config user.name "El Rincón del Feeder"
          git config user.email "feed-diario@users.noreply.github.com"
          git add data/soloq docs/soloq
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "SoloQ Challenge: clasificación de las $(TZ=Europe/Madrid date +%H:%M)"
          # el robot del periódico y la rutina de Claude también suben cosas: se reintenta encima de lo suyo
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
