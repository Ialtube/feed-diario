name: Aviso de la edición IA

# Cuando la rutina de Claude sube la edición del día, se avisa a Discord con la portada buena
# (la de la IA, nunca la de la imprenta). Solo una vez por edición.
on:
  push:
    branches: [main]
    paths: ["ai/edicion-*.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edicion-diaria
  cancel-in-progress: false

jobs:
  aviso:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Avisar a Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python -m roast avisar

      - name: Apuntar que ya se avisó
        run: |
          git config user.name "El Rincón del Feeder"
          git config user.email "feed-diario@users.noreply.github.com"
          git add data/editions
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Aviso a Discord de la edición del $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
