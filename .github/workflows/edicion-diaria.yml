name: Edición diaria

on:
  schedule:
    # 06:15 UTC = 08:15 en Madrid en verano, 07:15 en invierno
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Días anteriores a recuperar (0 = edición normal de hoy)"
        required: false
        default: "0"
      solo_rangos:
        description: "Solo guardar los rangos de hoy y actualizar la bolsa de LP (no toca la edición)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: edicion-diaria
  cancel-in-progress: false

jobs:
  edicion:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias (solo para Claude, opcional)
        run: pip install -r requirements.txt

      - name: Sacar la edición de hoy
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || '0' }}
          SOLO_RANGOS: ${{ inputs.solo_rangos || false }}
        run: |
          if [ "$SOLO_RANGOS" = "true" ]; then
            python -m roast rangos
          elif [ "$BACKFILL_DAYS" != "0" ]; then
            python -m roast backfill --days "$BACKFILL_DAYS"
          else
            python -m roast run
          fi

      - name: Guardar datos y web en el repositorio
        run: |
          git config user.name "El Rincón del Feeder"
          git config user.email "feed-diario@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Edición del $(date -u +%Y-%m-%d)"
            git push
          fi
